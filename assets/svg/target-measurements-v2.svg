<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-label="Top elevation compared with base elevation plus height"><defs><marker id="365f80s" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#365f80"/></marker><marker id="365f80e" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#365f80"/></marker><marker id="85603cs" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#85603c"/></marker><marker id="85603ce" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#85603c"/></marker><marker id="247257s" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#247257"/></marker><marker id="247257e" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#247257"/></marker></defs><rect width="1000" height="590" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="38" y="47" font-size="28" fill="#252830" font-weight="bold" text-anchor="start">Two ways to describe the target</text><text x="38" y="79" font-size="18" fill="#545e67" font-weight="normal" text-anchor="start">Typical examples — both methods use the same sea-level reference.</text><path d="M500 110L500 448" stroke="#d9dee2" stroke-width="2" /><text x="38" y="129" font-size="22" fill="#365f80" font-weight="bold" text-anchor="start">Top elevation</text><text x="538" y="129" font-size="22" fill="#365f80" font-weight="bold" text-anchor="start">Base elevation + height</text><path d="M48 395L70 370L91 376L112 327L131 338L154 267L170 278L198 175L214 227L228 250L237 300L250 340L252 395Z" fill="#e0e4df" stroke="#56695e" stroke-width="2"/><path d="M180 237L198 175L214 227L203 215L195 226L189 220Z" fill="#fafcff" stroke="#7c8b82" stroke-width="1.5"/><path d="M40 395L450 395" stroke="#365f80" stroke-width="2" stroke-dasharray="7 5"/><text x="40" y="425" font-size="17" fill="#365f80" font-weight="normal" text-anchor="start">Mean sea level</text><path d="M198 175L265 175" stroke="#a1a9af" stroke-width="2" stroke-dasharray="7 5"/><path d="M560 395L580 380L603 385L624 351L640 342L650 325H718L730 335L734 362L745 370V395Z" fill="#e3e0d9" stroke="#62696d" stroke-width="2"/><rect x="650" y="175" width="68" height="150" fill="#d6dfe5" stroke="#344b5b" stroke-width="2"/><rect x="663" y="194" width="9" height="13" fill="#ffffff"/><rect x="693" y="194" width="9" height="13" fill="#ffffff"/><rect x="663" y="224" width="9" height="13" fill="#ffffff"/><rect x="693" y="224" width="9" height="13" fill="#ffffff"/><rect x="663" y="254" width="9" height="13" fill="#ffffff"/><rect x="693" y="254" width="9" height="13" fill="#ffffff"/><rect x="663" y="284" width="9" height="13" fill="#ffffff"/><rect x="693" y="284" width="9" height="13" fill="#ffffff"/><path d="M540 395L950 395" stroke="#365f80" stroke-width="2" stroke-dasharray="7 5"/><text x="540" y="425" font-size="17" fill="#365f80" font-weight="normal" text-anchor="start">Mean sea level</text><path d="M718 175L765 175" stroke="#a1a9af" stroke-width="2" stroke-dasharray="7 5"/><path d="M718 325L765 325" stroke="#a1a9af" stroke-width="2" stroke-dasharray="7 5"/><path d="M265 389V181" stroke="#365f80" stroke-width="3" marker-start="url(#365f80s)" marker-end="url(#365f80e)"/><text x="286" y="264" font-size="19" fill="#365f80" font-weight="bold" text-anchor="start">Top elevation</text><text x="286" y="291" font-size="16" fill="#365f80" font-weight="normal" text-anchor="start">above sea level</text><path d="M765 319V181" stroke="#247257" stroke-width="3" marker-start="url(#247257s)" marker-end="url(#247257e)"/><text x="786" y="239" font-size="18" fill="#247257" font-weight="bold" text-anchor="start">Height above</text><text x="786" y="264" font-size="18" fill="#247257" font-weight="bold" text-anchor="start">the base</text><path d="M765 389V331" stroke="#85603c" stroke-width="3" marker-start="url(#85603cs)" marker-end="url(#85603ce)"/><text x="786" y="352" font-size="18" fill="#85603c" font-weight="bold" text-anchor="start">Base elevation</text><text x="786" y="377" font-size="16" fill="#85603c" font-weight="normal" text-anchor="start">above sea level</text><text x="38" y="460" font-size="17" fill="#252830" font-weight="normal" text-anchor="start">For a mountain, enter its summit elevation.</text><text x="538" y="460" font-size="17" fill="#252830" font-weight="normal" text-anchor="start">For an object, describe its base and height.</text><rect x="38" y="486" width="924" height="52" rx="6" fill="#f0f4f7"/><text x="500" y="519" font-size="21" fill="#263f52" font-weight="bold" text-anchor="middle">Top elevation = base elevation + height above the base</text><text x="38" y="567" font-size="16" fill="#545e67" font-weight="normal" text-anchor="start">The base also defines the object whose visible portion you want to measure.</text><text x="962" y="567" font-size="14" fill="#545e67" font-weight="normal" text-anchor="end">Not to scale</text></g></svg>