<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-label="Sea-level water compared with an elevated lake surface"><defs><marker id="365f80s" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#365f80" /></marker><marker id="365f80e" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#365f80" /></marker><marker id="85603cs" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#85603c" /></marker><marker id="85603ce" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#85603c" /></marker><marker id="247257s" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#247257" /></marker><marker id="247257e" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#247257" /></marker></defs><rect width="1000" height="650" fill="#ffffff" /><g font-family="Arial, sans-serif"><text x="38" y="47" font-size="28" fill="#252830" font-weight="bold" text-anchor="start">When is the surface above sea level?</text><text x="38" y="79" font-size="18" fill="#545e67" font-weight="normal" text-anchor="start">The horizon forms on the curved water surface.</text><path d="M500 110V438" fill="none" stroke="#d9dee2" stroke-width="2" /><g transform="translate(0,0)"><text x="38" y="129" font-size="22" fill="#365f80" font-weight="bold" text-anchor="start">Across the sea</text><path d="M134.56654 324.58342 A350 350 0 0 1 342.97947 317.57620 C335 346 322 380 310 414H170 C158 380 143 350 134.56654 324.58342Z" fill="#d8edf8" stroke="none" stroke-width="2" /><path d="M134.56654 324.58342 A350 350 0 0 1 342.97947 317.57620" fill="none" stroke="#367b9d" stroke-width="2.5" /><path d="M40 357 C52 351 62 348 74.24866 342.09032 L93.75134 331.90968 C109 325 119 321 134.56654 324.58342 C143 350 158 380 170 414H40Z" fill="#e3e0d9" stroke="#62696d" stroke-width="2" stroke-linejoin="round" /><path d="M342.97947 317.57620 C355 315 366 315 379.26651 323.41747 L406.73349 335.48253 C423 344 443 351 460 355 V414H310 C322 380 335 346 342.97947 317.57620Z" fill="#e3e0d9" stroke="#62696d" stroke-width="2" stroke-linejoin="round" /><g transform="rotate(23.71380171 393 329.45)" id="target-radial-350"><rect x="383" y="247.45" width="20" height="82" fill="#d6dfe5" stroke="#344b5b" stroke-width="2" /></g><path d="M69.1918 308.6325 L420.0000 301.4420" fill="none" stroke="#91613d" stroke-width="1.8" stroke-dasharray="6 4" /><circle cx="242.8276463181121" cy="305.07349722740076" r="4" fill="#91613d" /><text x="250" y="287" font-size="17" fill="#805127" font-weight="bold" text-anchor="middle">Horizon</text><text x="238" y="363" font-size="18" fill="#365f80" font-weight="normal" text-anchor="middle">Sea</text><text x="210" y="204" font-size="17" fill="#365f80" font-weight="normal" text-anchor="middle">Sea surface = mean sea level</text><path d="M185 215L205 307.904" fill="none" stroke="#365f80" stroke-width="1" /><g transform="rotate(-27.56512531 84 337)" id="observer-radial-350"><circle cx="84" cy="305" r="6" fill="#344b5b" /><path d="M84 311V326 M74 323L84 317L94 323 M84 326L77 337 M84 326L91 337" fill="none" stroke="#344b5b" stroke-width="2.5" stroke-linecap="round" /></g></g><g transform="translate(500,0)"><text x="38" y="129" font-size="22" fill="#365f80" font-weight="bold" text-anchor="start">Across an elevated lake</text><path id="separate-sea-at-datum" d="M436.58795 358.8835754052175 A350 350 0 0 1 480 391.18188083454163 V432 H436.58795Z" fill="#d8edf8" /><path d="M436.58795 358.8835754052175 A350 350 0 0 1 480 391.18188083454163" fill="none" stroke="#367b9d" stroke-width="2.5" /><path d="M134.50358 235.61286 A435 435 0 0 1 334.40383 228.26707 C326 244 316 249 307 263 C292 282 294 291 283.29422 306.58718 A350 350 0 0 0 194.67686 309.40001 C179 296 176 288 163 274 C147 257 150 244 134.50358 235.61286Z" fill="#d8edf8" stroke="none" stroke-width="2" /><path d="M134.50358 235.61286 A435 435 0 0 1 334.40383 228.26707" fill="none" stroke="#367b9d" stroke-width="2.5" /><path d="M45.00829 371.31285 C43 348 34 340 35 319 C36 300 32 291 31.69692 278.74375 C43 269 58 264 73.82906 256.18952 L94.17094 247.81048 C109 242 120 239 134.50358 235.61286 C150 244 147 257 163 274 C176 288 179 296 194.67686 309.40001 A350 350 0 0 0 45.00829 371.31285Z" fill="#e3e0d9" stroke="#62696d" stroke-width="2" stroke-linejoin="round" /><path d="M283.29422 306.58718 C294 291 292 282 307 263 C316 249 326 244 334.40383 228.26707 C349 224 363 228 378.81068 233.01552 L407.18932 242.74448 C420 249 433 254 440.09882 263.73610 C446 280 439 288 441 307 C443 324 435 339 436.58795 358.88357 A350 350 0 0 0 283.29422 306.58718Z" fill="#e3e0d9" stroke="#62696d" stroke-width="2" stroke-linejoin="round" /><g transform="rotate(18.92309922 393 237.88)" id="target-radial-435"><rect x="383" y="155.88" width="20" height="82" fill="#d6dfe5" stroke="#344b5b" stroke-width="2" /></g><path d="M71.8123 222.4118 L420.0000 217.6185" fill="none" stroke="#91613d" stroke-width="1.8" stroke-dasharray="6 4" /><circle cx="244.01209261224082" cy="220.04121463624205" r="4" fill="#91613d" /><text x="250" y="202" font-size="17" fill="#805127" font-weight="bold" text-anchor="middle">Horizon</text><path d="M40 375 A350 350 0 0 1 480 391.18188083454163" fill="none" stroke="#365f80" stroke-width="2" stroke-dasharray="7 5" /><path d="M250 226V299" fill="none" stroke="#365f80" stroke-width="2.5" marker-start="url(#365f80s)" marker-end="url(#365f80e)" /><text x="250" y="342" font-size="16" fill="#365f80" font-weight="bold" text-anchor="middle">Surface</text><text x="250" y="365" font-size="16" fill="#365f80" font-weight="bold" text-anchor="middle">elevation</text><text x="40" y="427" font-size="17" fill="#365f80" font-weight="normal" text-anchor="start">Mean sea level</text><path d="M133 414L155 318.14" fill="none" stroke="#365f80" stroke-width="1" /><g transform="rotate(-22.38728541 84 252)" id="observer-radial-435"><circle cx="84" cy="220" r="6" fill="#344b5b" /><path d="M84 226V241 M74 238L84 232L94 238 M84 241L77 252 M84 241L91 252" fill="none" stroke="#344b5b" stroke-width="2.5" stroke-linecap="round" /></g><text x="458" y="419" font-size="15" fill="#365f80" text-anchor="middle">Sea</text></g><text x="38" y="466" font-size="18" fill="#252830" font-weight="bold" text-anchor="start">Water surface = sea level</text><text x="538" y="466" font-size="18" fill="#252830" font-weight="bold" text-anchor="start">Lake surface is above sea level</text><rect x="38" y="486" width="924" height="64" rx="6" fill="#f0f4f7" /><text x="58" y="513" font-size="17" fill="#263f52" font-weight="normal" text-anchor="start">Enter the lake’s elevation, not its depth. All elevations still refer to mean sea level.</text><text x="58" y="538" font-size="17" fill="#263f52" font-weight="normal" text-anchor="start">The surface setting is independent of the target-entry method.</text><text x="38" y="578" font-size="16" fill="#545e67" font-weight="normal" text-anchor="start">Mountain views may be over land; sea level is still the reference.</text><text x="38" y="603" font-size="16" fill="#545e67" font-weight="normal" text-anchor="start">Intervening ridges and other terrain obstructions are not checked by the calculator.</text><text x="38" y="632" font-size="14" fill="#545e67" font-weight="normal" text-anchor="start">Schematic: curvature and heights exaggerated; refraction not shown.</text><text x="962" y="632" font-size="14" fill="#545e67" font-weight="normal" text-anchor="end">Not to scale</text></g></svg>